services:
  trailcam:
    build:
      context: .
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: trailcam-review
    volumes:
      # The kit itself: scripts, config, report, batches, logs.
      - ./:/app
      # The footage (read-write: files are moved to capture/to-delete).
      - ${HOME}/capture:/home/trailcam/capture
      # Pushover keys and the Claude token, read-only.
      - ${HOME}/.config/trailcam:/home/trailcam/.config/trailcam:ro
      # Claude Code's own settings and login, kept between runs.
      - claude-config:/home/trailcam/.claude-config
      # Use the server's time zone for timestamps in messages.
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - path: ${HOME}/.config/trailcam/claude.env
        required: false
    # Isolation: no extra privileges, and modest resource limits.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256

  # Records answers given on the alert pages ("check by eye": yes, no, something else);
  # the next run applies them. Sees only the kit, read-only, and writes only decisions/.
  # Start it with `docker compose up -d web` (see README, "Confirming sightings").
  web:
    image: trailcam-review
    entrypoint: ["python3", "trailcam.py", "serve"]
    restart: unless-stopped
    volumes:
      - ./:/app:ro
      - ./decisions:/app/decisions
      - /etc/localtime:/etc/localtime:ro
    networks:
      cams:
        aliases: [trailcam-web]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32

volumes:
  claude-config:

networks:
  # Shared with the web server's container, so it can reach the web service.
  cams:
    name: cams
